# Engine Configuration
# stockfish.path / lc0.path: leave empty to auto-detect (engines/ folder, then PATH, /usr/games, Homebrew).
# Install on the Raspberry Pi with scripts/install-engines.sh [--lc0].
stockfish.path=
stockfish.threads=2
stockfish.hash=64
# engine.profile: stockfish | stockfish-lite | maia-1100 | maia-1500 | maia-1900
engine.profile=stockfish

# Lichess API Configuration

# Game Configuration
game.default.duration=10
game.default.increment=0
